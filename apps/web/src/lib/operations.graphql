query Projects {
  viewer { canCreateProjects }
  projects @connection(mode: "page") {
    edges { cursor node { id slug name canAdmin } }
    pageInfo { startCursor endCursor hasPreviousPage hasNextPage }
  }
}
query Analytics($id: UUID!) {
  project(id: $id) {
    id name settings
    reports { id key result computedAt }
    funnels { id key name definition }
  }
}
query ProjectAdmin($id: UUID!) {
  project(id: $id) {
    id
    writeKeys { id source revokedAt }
    accessKeys { id name role revokedAt }
    destinations { id name kind config }
  }
}
mutation CreateProject($slug: String!, $name: String!) {
  createProject(slug: $slug, name: $name) { id slug name canAdmin }
}
mutation IssueWriteKey($projectId: UUID!, $source: String!) {
  issueWriteKey(projectId: $projectId, source: $source) { id token }
}
mutation RevokeWriteKey($projectId: UUID!, $id: UUID!) {
  revokeWriteKey(projectId: $projectId, id: $id)
}
mutation IssueAccessKey($projectId: UUID!, $name: String!, $role: ProjectRole!) {
  issueAccessKey(projectId: $projectId, name: $name, role: $role) { id token }
}
mutation RevokeAccessKey($projectId: UUID!, $id: UUID!) {
  revokeAccessKey(projectId: $projectId, id: $id)
}
mutation UpdateSettings($projectId: UUID!, $settings: JSON!) {
  updateSettings(projectId: $projectId, settings: $settings) { id settings }
}
mutation SaveFunnel($projectId: UUID!, $definition: JSON!) {
  saveFunnel(projectId: $projectId, definition: $definition) { id key name definition }
}
mutation DeleteFunnel($projectId: UUID!, $key: String!) {
  deleteFunnel(projectId: $projectId, key: $key)
}
mutation RefreshAnalytics($projectId: UUID!) {
  refreshAnalytics(projectId: $projectId)
}
mutation EraseActor($projectId: UUID!, $externalId: String!) {
  eraseActor(projectId: $projectId, externalId: $externalId)
}
mutation SaveDestination($projectId: UUID!, $name: String!, $config: JSON!) {
  saveMixpanelDestination(projectId: $projectId, name: $name, config: $config) { id name kind config }
}
mutation DeleteDestination($projectId: UUID!, $id: UUID!) {
  deleteDestination(projectId: $projectId, id: $id)
}
