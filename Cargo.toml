[workspace]
resolver = "3"
members = ["crates/*", "apps/api", "apps/worker", "apps/mcp", "migrations"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["LockVoid Labs"]
repository = "https://github.com/lockvoid/clickman-server"

[workspace.dependencies]
clickman-protocol = { path = "crates/protocol" }
clickman-storage = { path = "crates/storage" }
clickman-analytics = { path = "crates/analytics" }
clickman-destinations = { path = "crates/destinations" }
clickman-jobs = { path = "crates/jobs" }
clickman-engine = { path = "crates/engine" }
clickman-graphql = { path = "crates/graphql" }
clickman-migrations = { path = "migrations" }
clickman-mcp = { path = "crates/mcp" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
clickhouse = { version = "=0.15.3", features = ["uuid", "chrono", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
url = "2"
anyhow = "1"
async-trait = "0.1"
async-graphql = { version = "=7.2.1", default-features = false, features = ["chrono", "uuid"] }
apalis = "0.7.4"
apalis-cron = "0.7.4"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmp-serde = "1.3"
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ipnet = "2.11"
subtle = "2.6"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "compression-gzip", "request-id", "timeout", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
